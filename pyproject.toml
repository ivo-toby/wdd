[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-delivery"
version = "0.1.0"
description = "Deterministic state controller for Wave-Driven Development"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wddctl = "wave_delivery.cli:main"

[tool.setuptools]
packages = ["wave_delivery"]
